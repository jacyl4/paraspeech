syntax = "proto3";

package paraspeech.v1;

option go_package = "paraspeech/api/proto/paraspeech/v1;paraspeechv1";

service HealthService {
    rpc Check(HealthRequest) returns (HealthResponse);
}

message HealthRequest {}

message HealthResponse {
    bool ok = 1;
    string service = 2;
    string version = 3;
    ChannelHealth stt = 4;
    ChannelHealth tts = 5;
}

message ChannelHealth {
    bool enabled = 1;
    string model = 2;
    string vad_mode = 3;
    bool vault_ready = 4;
}
