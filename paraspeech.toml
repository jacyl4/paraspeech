# /etc/paraspeech/paraspeech.toml

[server]
grpc_addr = "127.0.0.1:9800"
shutdown_timeout = "10s"

[vault]
secrets_file = "/etc/paraspeech/secrets.env"

[log]
level = "info"
format = "json"

[stt]
enabled = true
max_bytes = 26214400
direct_max_bytes = 1048576
timeout = "90s"
default_model = "gpt-4o-mini-transcribe"

[stt.vad]
mode = "on"
hop_size = 256
threshold = 0.5
min_speech_ms = 200
pad_ms = 150
max_gap_ms = 500
max_audio_sec = 30
min_trim_ratio = 0.3

[stt.upstream]
endpoint = "https://api.openai.com/v1/audio/transcriptions"
connect_timeout = "5s"
read_timeout = "90s"
max_connections = 20
max_keepalive = 10
keepalive_interval = "60s"
prewarm_on_start = true
prewarm_fail_open = true
prewarm_timeout = "800ms"

[tts]
enabled = true
max_body = 524288
timeout = "45s"
default_model = "gpt-4o-mini-tts"
default_voice = "nova"
default_speed = 1.22
default_emotion = "neutral"
default_style = "conversational"
default_format = "opus"
max_sec = 25.0
max_parallel = 3

[tts.upstream]
endpoint = "https://api.openai.com/v1/audio/speech"
connect_timeout = "5s"
read_timeout = "45s"
max_connections = 20
max_keepalive = 10
keepalive_interval = "60s"
prewarm_on_start = true
prewarm_fail_open = true
prewarm_timeout = "800ms"
